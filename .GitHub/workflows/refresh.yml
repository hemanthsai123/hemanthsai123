name: Refresh market visuals

on:
  schedule:
    - cron: "*/30 3-10 * * 1-5" # every 30 min, 08:30-16:00 IST on weekdays (UTC clock)
    - cron: "30 11 * * 1-5" # one run after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-visuals
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch indices (soft-fail keeps the last snapshot)
        run: python scripts/fetch_market.py
      - name: Run screener (soft-fail)
        run: python screener/screener.py || true
      - name: Market agent brief
        run: python agent/market_agent.py
      - name: Build SVGs
        run: python scripts/build_visuals.py
      - name: Commit if changed
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || (git commit -m "chore: refresh market visuals" && git push)
          
